services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_PATH}/nextcloud/config:/config
      - ${PAL_PATH}/data:/data
    ports:
      - 443:443
    restart: unless-stopped

  nextcloud_db:
    image: postgres:16
    container_name: postgres
    environment:
      - TZ=${TIMEZONE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${DOCKER_PATH}/nextcloud/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    restart: unless-stopped

# Must run this in the NC container to generate the JWT secret key for Whiteboard:
#    occ config:app:set whiteboard collabBackendUrl --value="https://<your-domain>:3002"
#    occ config:app:set whiteboard jwt_secret_key --value="<same value as WHITEBOARD_JWT_SECRET_KEY>"
  whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:stable
    container_name: whiteboard
    environment:
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - JWT_SECRET_KEY=${WHITEBOARD_JWT_SECRET_KEY}
    ports:
      - 3002:3002
    restart: unless-stopped
