services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - TZ=${TIMEZONE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${DOCKER_PATH}/postgres/data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    restart: unless-stopped

  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_PATH}/nextcloud/config:/config
      - ${PAL_PATH}/data:/data
    ports:
      - 443:443
    restart: unless-stopped
